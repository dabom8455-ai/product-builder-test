<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body{margin:0;}
    a{color:#1F4D3A;} a:hover{color:#C9A24B;}
  </style>
</helmet>

<div style="width:1080px;height:1350px;background:#F6F1E7;font-family:'Noto Sans KR',sans-serif;color:#23291F;display:flex;flex-direction:column;overflow:hidden;">

  <!-- Header band -->
  <div style="background:#1F4D3A;color:#F6F1E7;padding:52px 64px 40px;display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;gap:18px;">
      <span style="display:inline-flex;width:64px;height:64px;border-radius:16px;background:#C9A24B;align-items:center;justify-content:center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1F4D3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </span>
      <div style="display:flex;flex-direction:column;">
        <span style="font-family:'Noto Serif KR',serif;font-weight:900;font-size:48px;letter-spacing:.01em;line-height:1;">도현피아노</span>
        <span style="font-size:20px;color:#E6D9B8;margin-top:8px;letter-spacing:.02em;">용인 모현읍 · 초등 피아노 학원</span>
      </div>
    </div>
    <div style="height:3px;width:120px;background:#C9A24B;border-radius:2px;margin-top:6px;"></div>
  </div>

  <!-- Hero -->
  <div style="padding:46px 64px 8px;display:flex;flex-direction:column;gap:16px;">
    <h1 style="font-family:'Noto Serif KR',serif;font-weight:900;font-size:56px;line-height:1.28;margin:0;color:#1F4D3A;text-wrap:balance;">한 곡을 외우기보다,<br>스스로 악보를 읽는 아이로</h1>
    <p style="font-size:27px;line-height:1.55;margin:0;color:#4A4E42;">무조건 진도를 빨리 빼기보다, 지금 이 아이에게<br>필요한 것을 먼저 살펴 <b style="color:#1F4D3A;">기초부터 제대로</b> 쌓습니다.</p>
  </div>

  <!-- 4 points -->
  <div style="padding:30px 64px 10px;">
    <div style="font-size:20px;font-weight:700;letter-spacing:.14em;color:#B88A2E;margin-bottom:20px;">이렇게 지도합니다</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;">
      <div style="display:flex;align-items:center;gap:16px;background:#FFFDF8;border:1px solid #E4DCC8;border-radius:16px;padding:22px 24px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9A24B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span style="font-size:27px;font-weight:700;">악보 정확히 읽기</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;background:#FFFDF8;border:1px solid #E4DCC8;border-radius:16px;padding:22px 24px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9A24B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span style="font-size:27px;font-weight:700;">리듬과 박자</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;background:#FFFDF8;border:1px solid #E4DCC8;border-radius:16px;padding:22px 24px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9A24B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span style="font-size:27px;font-weight:700;">손가락 번호·기본기</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;background:#FFFDF8;border:1px solid #E4DCC8;border-radius:16px;padding:22px 24px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9A24B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span style="font-size:27px;font-weight:700;">표현과 음악성</span>
      </div>
    </div>
  </div>

  <!-- 상담 안내 -->
  <div style="padding:26px 64px 6px;">
    <div style="background:#EAF0EA;border-left:6px solid #2E6E5E;border-radius:12px;padding:22px 28px;">
      <p style="margin:0;font-size:25px;line-height:1.5;color:#274035;"><b style="color:#1F4D3A;">상담은 저녁 6시 이후 예약제</b>로 진행해요.<br>미리 연락 주시면 아이 성향에 맞춰 편하게 안내드릴게요.</p>
    </div>
  </div>

  <!-- Footer band -->
  <div style="margin-top:auto;background:#1F4D3A;color:#F6F1E7;padding:40px 64px 46px;display:flex;flex-direction:column;gap:18px;">
    <div style="display:flex;align-items:center;gap:16px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9A24B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <span style="font-size:25px;color:#EDE4CD;">경기 용인시 처인구 모현읍 왕산로14 몬테로이 2단지 상가</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9A24B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L7.6 9.8a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2Z"/></svg>
      <span style="font-family:'Noto Serif KR',serif;font-weight:700;font-size:40px;letter-spacing:.02em;color:#F6F1E7;">010-5158-3613</span>
      <span style="font-size:22px;color:#C9A24B;font-weight:700;margin-left:4px;">무료 상담</span>
    </div>
    <div style="height:1px;background:rgba(246,241,231,.18);margin:6px 0 2px;"></div>
    <div style="display:flex;gap:28px;font-size:21px;color:#D9CBA6;">
      <span>네이버 · 도현피아노</span>
      <span>인스타 @dohyeon_piano</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
