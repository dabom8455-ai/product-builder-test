<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;600;700;900&family=Noto+Sans+KR:wght@200;300;400&display=swap">
  <style>body{margin:0;} a{color:#D9BE7E;} a:hover{color:#F2DBA6;}</style>
</helmet>

<!-- 도현피아노 · 다크 럭셔리 (final) -->
<div style="width:1080px;height:1350px;background:
      radial-gradient(120% 80% at 50% 8%, #1B2C24 0%, #142019 55%, #0F1813 100%);
      color:#EDE7D6;font-family:'Noto Serif KR',Georgia,serif;box-sizing:border-box;padding:60px;position:relative;">

  <!-- inset gold frame, double hairline -->
  <div style="position:absolute;inset:40px;border:1px solid rgba(201,162,75,.55);"></div>
  <div style="position:absolute;inset:48px;border:1px solid rgba(201,162,75,.16);"></div>

  <div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 56px 58px;box-sizing:border-box;">

    <!-- gold foil logo mark (recreated) -->
    <svg width="200" height="168" viewBox="0 0 240 202" fill="none" aria-label="도현피아노 로고">
      <!-- heart outline -->
      <path d="M120 176 C58 128 26 96 26 62 C26 37 45 22 68 22 C86 22 104 33 120 56 C136 33 154 22 172 22 C195 22 214 37 214 62 C214 96 182 128 120 176 Z"
            stroke="#C9A24B" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- note stem + head (left) -->
      <path d="M96 70 V132" stroke="#C9A24B" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="84" cy="134" r="12.5" fill="#C9A24B"/>
      <!-- three piano keys -->
      <rect x="112" y="86" width="13" height="60" rx="4" stroke="#C9A24B" stroke-width="4"/>
      <rect x="133" y="80" width="13" height="66" rx="4" stroke="#C9A24B" stroke-width="4"/>
      <rect x="154" y="88" width="13" height="58" rx="4" stroke="#C9A24B" stroke-width="4"/>
      <!-- baseline arc -->
      <path d="M96 148 Q140 158 184 140" stroke="#C9A24B" stroke-width="3.6" stroke-linecap="round"/>
      <!-- right scroll -->
      <path d="M184 140 c22 -6 24 -34 6 -34 c-12 0 -12 16 0 16" stroke="#C9A24B" stroke-width="3.6" stroke-linecap="round"/>
    </svg>

    <!-- wordmark -->
    <div style="font-weight:900;font-size:60px;letter-spacing:.14em;padding-left:.14em;margin-top:26px;color:#F4EEDD;">도현피아노</div>
    <div style="font-family:'Noto Sans KR',sans-serif;font-weight:300;font-size:17px;letter-spacing:.52em;color:#C9A24B;padding-left:.52em;margin-top:16px;">DOHYEON PIANO STUDIO</div>
    <div style="font-family:'Noto Sans KR',sans-serif;font-weight:200;font-size:20px;letter-spacing:.16em;color:#9AA091;margin-top:14px;">용인 모현읍 · 초등 피아노</div>

    <!-- fleuron divider -->
    <div style="display:flex;align-items:center;gap:16px;margin:44px 0;">
      <div style="width:70px;height:1px;background:linear-gradient(90deg,transparent,#C9A24B);"></div>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="#C9A24B"><path d="M8 0l1.6 6.4L16 8l-6.4 1.6L8 16l-1.6-6.4L0 8l6.4-1.6z"/></svg>
      <div style="width:70px;height:1px;background:linear-gradient(90deg,#C9A24B,transparent);"></div>
    </div>

    <!-- statement -->
    <h1 style="font-weight:200;font-size:47px;line-height:1.62;margin:0;color:#F1EBD9;">
      한 곡을 외우기보다,<br><span style="font-weight:600;color:#E3C88C;">스스로 악보를 읽는</span> 아이로.
    </h1>

    <!-- curriculum, quiet centered row -->
    <div style="margin-top:46px;">
      <div style="font-family:'Noto Sans KR',sans-serif;font-weight:400;font-size:15px;letter-spacing:.42em;color:#9AA091;padding-left:.42em;margin-bottom:20px;">CURRICULUM</div>
      <div style="font-family:'Noto Sans KR',sans-serif;font-weight:300;font-size:23px;letter-spacing:.04em;color:#E4DECB;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px 18px;">
        <span>악보 읽기</span><span style="color:#C9A24B;font-size:12px;">◆</span>
        <span>리듬과 박자</span><span style="color:#C9A24B;font-size:12px;">◆</span>
        <span>기본기</span><span style="color:#C9A24B;font-size:12px;">◆</span>
        <span>음악성</span>
      </div>
    </div>

    <!-- footer -->
    <div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:13px;">
      <div style="font-family:'Noto Sans KR',sans-serif;font-weight:200;font-size:18px;letter-spacing:.06em;color:#9DA394;">상담 · 저녁 6시 이후 예약제</div>
      <div style="font-weight:700;font-size:40px;letter-spacing:.08em;color:#E3C88C;">010-5158-3613</div>
      <div style="font-family:'Noto Sans KR',sans-serif;font-weight:200;font-size:16px;letter-spacing:.05em;color:#868C7C;">용인 모현읍 왕산로14 몬테로이 2단지 상가</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
